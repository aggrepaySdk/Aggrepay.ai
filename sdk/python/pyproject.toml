[project]
name = "aggrepay"
version = "1.0.0"
description = "Python SDK for Aggrepay Merchant API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
urls = { Homepage = "https://aggrepay.ai/docs", Repository = "https://github.com/aggrepaySdk/Aggrepay.ai" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aggrepay*"]
